<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600&display=swap" rel="stylesheet">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <!-- Theme script (prevent flash of light/dark theme) -->
  <script>
    (function() {
      const theme = localStorage.getItem('portfolio-theme') || 
                    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <div class="bg-triangles">
    <a href="#main-content" class="skip-link">Skip to content</a>
    
    <main class="main">
      <div class="container gutter-top">
        
        <!-- Header -->
        {% include header.html %}
        
        <div class="row sticky-parent">
          <!-- Sidebar / Navigation -->
          <aside class="col-12 col-md-12 col-lg-2">
            {% include sidebar.html %}
          </aside>
          
          <!-- Page Content -->
          <div class="col-12 col-md-12 col-lg-10">
            <div id="main-content" class="box box-content box-entrance box-entrance--content">
              {{ content }}
            </div>
            
            <!-- Footer -->
            {% include footer.html %}
          </div>
        </div>
        
      </div>
    </main>

    <!-- Scroll to Top Button -->
    <button class="scroll-to-top" aria-label="Scroll to top" id="scrollToTop">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="18 15 12 9 6 15"></polyline>
      </svg>
    </button>
  </div>

  <!-- Scripts -->
  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
