---
layout: default
title: Contact Operator
---
<div class="pb-2">
  <h1 class="title title--h1 first-title title__separate">Contact Operator<span class="title--tone">.</span></h1>
  <p class="portfolio-intro">Establish a secure connection. Fill out the console transmission form below to send a message.</p>
</div>

<section id="contact" class="reveal reveal-delay-2">
  <form class="contact-form" action="https://formspree.io/f/your-id" method="POST">
    <div class="form-group">
      <label for="form-name" class="form-label text-uppercase">Transmission Source (Name)</label>
      <input type="text" id="form-name" name="name" class="form-input" placeholder="e.g. John Doe" required>
    </div>
    
    <div class="form-group">
      <label for="form-email" class="form-label text-uppercase">Return Address (Email)</label>
      <input type="email" id="form-email" name="email" class="form-input" placeholder="e.g. sender@example.com" required>
    </div>

    <div class="form-group">
      <label for="form-subject" class="form-label text-uppercase">Protocol Subject</label>
      <input type="text" id="form-subject" name="subject" class="form-input" placeholder="e.g. DevOps Consulting" required>
    </div>

    <div class="form-group">
      <label for="form-message" class="form-label text-uppercase">Payload Message</label>
      <textarea id="form-message" name="message" class="form-input form-textarea" rows="6" placeholder="Write your transmission contents here..." required></textarea>
    </div>

    <button type="submit" class="cv-btn cv-btn--header form-submit-btn">
      <span class="cv-btn__icon">⚡</span>
      <span class="cv-btn__text">Send Payload</span>
    </button>
  </form>
</section>
