# Site settings
title: "Operator Console — Portfolio"
description: "Professional portfolio and system status operator dashboard replica."
url: "https://username.github.io" # Change to your domain
baseurl: "" # Change if hosting in a subdirectory e.g. "/portfolio"

# Personal Information
author:
  name: "Your Name"
  surname: "Surname"
  role_prefix: "operator/01"
  email: "your.email@example.com"
  status: "available" # available, busy, offline
  timezone: "GMT+1"
  response_time: "<24h"
  avatar: "https://adityacprtm.dev/cdn-cgi/image/width=320,format=auto,quality=85/https://r2.adityacprtm.dev/production/cb0ee630-8f2e-4687-a896-ee65e82086cb_imluhv_f28a4e.png" # Place your image here
  roles:
    - "DevOps Cloud Engineer"
    - "Site Reliability Engineer"
    - "Platform Engineer"
    - "Cloud Architect"
  social:
    facebook: "https://facebook.com/username"
    x: "https://x.com/username"
    instagram: "https://instagram.com/username"
    linkedin: "https://linkedin.com/in/username"
    github: "https://github.com/username"

# Build settings
markdown: kramdown
theme: minima # standard jekyll minima theme configurations can be overridden or custom layout is used
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
