---
layout: default
---
<article class="post">
  <header class="post-header pb-2">
    <div class="reveal">
      <h1 class="title title--h1 first-title title__separate">{{ page.title }}</h1>
    </div>
    <div class="post-meta overhead text-uppercase">
      <span>Published: {{ page.date | date: "%B %d, %Y" }}</span>
      {% if page.author %}
        <span>• By {{ page.author }}</span>
      {% endif %}
      {% if page.category %}
        <span>• In {{ page.category }}</span>
      {% endif %}
    </div>
  </header>

  <div class="post-content reveal reveal-delay-2 entry-content">
    {{ content }}
  </div>

  <div class="post-footer mt-2 pt-2 border-top">
    <p><a href="{{ '/blog' | relative_url }}" class="about-portfolio-link">← Back to Blog</a></p>
  </div>
</article>
